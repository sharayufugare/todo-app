services:
  - type: web
    name: todo-app
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/todo-app-1.0.0.jar
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
