# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=
server.servlet.session.cookie.same-site=lax

# Database Configuration
# Set these as environment variables on your hosting platform:
#   DB_URL      -> jdbc:mysql://<host>:3306/todoapp_db?useSSL=true&serverTimezone=UTC
#   DB_USERNAME -> your DB user
#   DB_PASSWORD -> your DB password
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todoapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:DBMS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=true

# JWT Configuration - IMPORTANT: set JWT_SECRET as an env variable in production!
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Security
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# Error handling (safe for production)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
